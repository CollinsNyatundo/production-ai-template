<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="layer-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="12" fill="url(#arch-bg)"/>
  <rect width="1200" height="480" rx="12" fill="url(#arch-grid)" opacity="0.5"/>

  <!-- Header -->
  <text x="40" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">System Architectural Taxonomy &amp; 9-Layer Vectorless Breakdown</text>
  <text x="40" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">OpenKB Sidecar Knowledge Compiler + Harness Model Decomposition H = (E, T, C, S, L, V)</text>

  <!-- 3 Columns Layout -->

  <!-- COLUMN 1: Ingress & Vectorless OpenKB Knowledge Compiler (Layers 1-3) -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="350" height="360" rx="10" fill="url(#layer-card)" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="30" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">1. INGRESS &amp; VECTORLESS OPENKB</text>

    <!-- Layer 1: FastAPI API -->
    <rect x="15" y="45" width="320" height="80" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
    <text x="30" y="68" fill="#E0F2FE" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 1: FastAPI Core API Entrypoint</text>
    <text x="30" y="88" fill="#7DD3FC" font-family="monospace" font-size="11">app/main.py (SSE Streaming &amp; Tenant Auth)</text>
    <text x="30" y="106" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Session isolation: tenant_id:session_id</text>

    <!-- Layer 2: OpenKB Sidecar Compiler -->
    <rect x="15" y="140" width="320" height="100" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="30" y="163" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 2: OpenKB Sidecar (No Vector DB!)</text>
    <text x="30" y="183" fill="#34D399" font-family="monospace" font-size="11">OpenKB REST Client + PageIndex Tree Reasoning</text>
    <text x="30" y="201" fill="#FEF3C7" font-family="-apple-system, sans-serif" font-size="10">Compiles raw docs into persistent Markdown wikis</text>
    <text x="30" y="217" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="10">Dual BM25 + Dense Search &amp; Batched Reranking</text>

    <!-- Layer 3: Core Orchestration -->
    <rect x="15" y="255" width="320" height="85" rx="6" fill="#1E293B" stroke="#16A34A" stroke-width="1"/>
    <text x="30" y="278" fill="#DCFCE7" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 3: RAG Pipeline Orchestrator</text>
    <text x="30" y="298" fill="#4ADE80" font-family="monospace" font-size="11">app/services/rag_pipeline.py</text>
    <text x="30" y="316" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Guarded by AsyncCircuitBreaker instances</text>
  </g>

  <!-- COLUMN 2: Agent Harness H = (E, T, C, S, L, V) (Layers 4-6) -->
  <g transform="translate(425, 90)">
    <rect x="0" y="0" width="350" height="360" rx="10" fill="url(#layer-card)" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="30" fill="#A855F7" font-family="monospace" font-size="13" font-weight="700">2. AGENTIC HARNESS H = (E,T,C,S,L,V)</text>

    <!-- Layer 4: Context & Headroom Crusher -->
    <rect x="15" y="45" width="320" height="80" rx="6" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="30" y="68" fill="#FCE7F3" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 4 (C &amp; S): Context &amp; Headroom Crusher</text>
    <text x="30" y="88" fill="#F472B6" font-family="monospace" font-size="11">headroom_adapter.py &amp; context_manager.py</text>
    <text x="30" y="106" fill="#F472B6" font-family="-apple-system, sans-serif" font-size="10">Reversible AST crushing + expand_context tool</text>

    <!-- Layer 5: Pub/Sub Hooks -->
    <rect x="15" y="140" width="320" height="80" rx="6" fill="#1E293B" stroke="#C084FC" stroke-width="1"/>
    <text x="30" y="163" fill="#F3E8FF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 5 (L): Async Lifecycle Hooks</text>
    <text x="30" y="183" fill="#E9D5FF" font-family="monospace" font-size="11">hooks.py (on_tool_execute, on_llm_call)</text>
    <text x="30" y="201" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Asynchronous event broadcasting &amp; metrics</text>

    <!-- Layer 6: ReAct Agent Loop -->
    <rect x="15" y="235" width="320" height="105" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="30" y="258" fill="#F3E8FF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 6 (E &amp; T): ReAct Execution Loop</text>
    <text x="30" y="278" fill="#C084FC" font-family="monospace" font-size="11">executor.py &amp; tools/registry.py</text>
    <text x="30" y="296" fill="#9333EA" font-family="-apple-system, sans-serif" font-size="10">NVIDIA NIM (meta/llama-3.1-70b-instruct)</text>
    <text x="30" y="312" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Server-side permission level enforcement</text>
  </g>

  <!-- COLUMN 3: Guardrails, Security & Eval (Layers 7-9) -->
  <g transform="translate(810, 90)">
    <rect x="0" y="0" width="350" height="360" rx="10" fill="url(#layer-card)" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="30" fill="#F43F5E" font-family="monospace" font-size="13" font-weight="700">3. SECURITY, EVAL &amp; DEVSECOPS</text>

    <!-- Layer 7: Guardrails & Circuit Breakers -->
    <rect x="15" y="45" width="320" height="80" rx="6" fill="#1E293B" stroke="#E11D48" stroke-width="1"/>
    <text x="30" y="68" fill="#FFE4E6" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 7: Security &amp; Async Resilience</text>
    <text x="30" y="88" fill="#FB7185" font-family="monospace" font-size="11">auth.py, resilience.py, content_filter</text>
    <text x="30" y="106" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">AsyncCircuitBreaker + secret &amp; PII redaction</text>

    <!-- Layer 8: Observability & Valuation -->
    <rect x="15" y="140" width="320" height="80" rx="6" fill="#1E293B" stroke="#059669" stroke-width="1"/>
    <text x="30" y="163" fill="#D1FAE5" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 8 (V): Observability &amp; Valuation</text>
    <text x="30" y="183" fill="#34D399" font-family="monospace" font-size="11">tracer.py, offline_eval.py, trajectory_logger</text>
    <text x="30" y="201" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Active trajectory logging &amp; OpenTelemetry</text>

    <!-- Layer 9: DevSecOps & Strict Quality -->
    <rect x="15" y="235" width="320" height="105" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
    <text x="30" y="258" fill="#E0E7FF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layer 9: DevSecOps &amp; Zero-Any Quality</text>
    <text x="30" y="278" fill="#818CF8" font-family="monospace" font-size="11">.github/workflows/ci.yml &amp; AGENTS.md</text>
    <text x="30" y="296" fill="#818CF8" font-family="-apple-system, sans-serif" font-size="10">Mypy strict mode (zero implicit Any)</text>
    <text x="30" y="312" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Ruff linting &amp; automated database migrations</text>
  </g>
</svg>
