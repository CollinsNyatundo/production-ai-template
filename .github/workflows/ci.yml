name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      APP_ENV: test
      JWT_SECRET: test-suite-secret-not-for-production
      NVIDIA_API_KEY: ""
      SKIP_OPENKB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app evaluation observability scripts tests
      - run: bandit -r app -ll -ii
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - run: PYTHONPATH=. python scripts/migrate.py upgrade
