<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Dark Isometric Canvas Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="top-bar-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="iso-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2,4"/>
    </pattern>

    <!-- Rounded Corner Clip for Embedded Image -->
    <clipPath id="hero-img-clip">
      <rect x="0" y="0" width="480" height="240" rx="10"/>
    </clipPath>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="480" rx="16" fill="url(#bg-gradient)"/>
  <rect width="1200" height="480" rx="16" fill="url(#iso-grid)" opacity="0.6"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#top-bar-accent)"/>

  <!-- LEFT SECTION: Brand Title, Metadata & AI Helper Artwork -->
  <g transform="translate(50, 40)">
    <!-- OpenKB Vectorless RAG Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="4" fill="#34D399"/>
    <text x="28" y="18" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OPENKB VECTORLESS RAG ARCHITECTURE</text>

    <!-- Title -->
    <text x="0" y="70" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Production AI Template</text>
    
    <!-- Subtitle -->
    <text x="0" y="98" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Resilient Multi-Tenant Agent Backend • OpenKB Knowledge Compilation • Headroom Context Crusher</text>

    <!-- Hero Image Card Container -->
    <g transform="translate(0, 120)">
      <rect x="-2" y="-2" width="484" height="244" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>
      <g clip-path="url(#hero-img-clip)">
        <image href="./hero_ai_figures.jpg" x="0" y="0" width="480" height="240" preserveAspectRatio="xMidYMid slice"/>
      </g>
    </g>

    <!-- Tech Badges Bar -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="130" height="26" rx="5" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
      <text x="65" y="17" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">OpenKB Sidecar</text>

      <rect x="138" y="0" width="135" height="26" rx="5" fill="#1F2937" stroke="#EC4899" stroke-width="1"/>
      <text x="205" y="17" fill="#F472B6" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Headroom Crusher</text>

      <rect x="281" y="0" width="105" height="26" rx="5" fill="#1F2937" stroke="#3B82F6" stroke-width="1"/>
      <text x="333" y="17" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">NVIDIA NIM</text>

      <rect x="394" y="0" width="86" height="26" rx="5" fill="#1F2937" stroke="#8B5CF6" stroke-width="1"/>
      <text x="437" y="17" fill="#C084FC" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Zero Any</text>
    </g>
  </g>

  <!-- RIGHT SECTION: 9-Layer System Flow Window -->
  <g transform="translate(570, 40)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="580" height="400" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Title Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 568 0 Q 580 0 580 12 L 580 38 L 0 38 Z" fill="#1E293B"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    <text x="290" y="23" fill="#9CA3AF" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">system_flow_harness.py — Vectorless RAG Pipeline</text>

    <!-- Flow Cards -->
    <g transform="translate(25, 55)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="530" height="70" rx="8" fill="#111827" stroke="#10B981" stroke-width="1"/>
      <text x="18" y="26" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">1. Client Request &amp; Auth Gate</text>
      <text x="18" y="46" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">FastAPI entrypoint with tenant-isolated session keys (tenant_id:session_id) &amp; rate limits.</text>

      <!-- Arrow -->
      <path d="M 265 70 L 265 82" stroke="#4B5563" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Step 2 -->
      <rect x="0" y="82" width="530" height="72" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1"/>
      <text x="18" y="106" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">2. OpenKB Knowledge Compiler (No Vector DB!)</text>
      <text x="18" y="126" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">Tree-indexed PageIndex reasoning + BM25 + dense knowledge search over Markdown wikis.</text>

      <!-- Arrow -->
      <path d="M 265 154 L 265 166" stroke="#4B5563" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Step 3 -->
      <rect x="0" y="166" width="530" height="72" rx="8" fill="#111827" stroke="#EC4899" stroke-width="1"/>
      <text x="18" y="190" fill="#F472B6" font-family="monospace" font-size="12" font-weight="700">3. Headroom Reversible Context Crusher</text>
      <text x="18" y="210" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">In-process AST payload crushing with expand_context tool for zero token waste.</text>

      <!-- Arrow -->
      <path d="M 265 238 L 265 250" stroke="#4B5563" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Step 4 -->
      <rect x="0" y="250" width="530" height="75" rx="8" fill="#111827" stroke="#8B5CF6" stroke-width="1"/>
      <text x="18" y="274" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">4. ReAct Agent Engine &amp; Circuit Breakers</text>
      <text x="18" y="294" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11">NVIDIA NIM LLM reasoning, AsyncCircuitBreakers, trajectory quality evaluation &amp; OTEL spans.</text>
    </g>
  </g>
</svg>
